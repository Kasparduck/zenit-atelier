<!-- Hora Vera, la PRIMA PAGINA «L'ora vera»: la presentazione.
     LA LUCE A CHIAZZE (Franco, 14/11/2026, alla lettera): «Non voglio più l'onda ma lo stesso effetto che hai applicato alle immagini di prima,
     la differenza è che poi si passa dal dark mode al video non dark diciamo, allargando sempre di più le chiazze chiare, fino a che il "white
     mode" non appare del tutto»; e prima: «a chiazze molto più larghe in movimento dal dark all'illuminato».
     COME È FATTA
     - I due filmati stanno in UN file solo (immagini/presentazione.mp4), uno sopra l'altro: così vanno sempre insieme. Va UNA volta sola e resta
       sull'ultimo fotogramma (regola di Hora Vera: nessun filmato in giro continuo); dura 9 s e va un po' più piano (DURATA).
     - AL CONTRARIO (Franco, 14/11 sera: «fai il contrario va, passa dal chiaro allo scuro e alla fine accendi le voci. Se ce n'è una beige o
       marroncina falla diventare dello stesso colore di alfa, beta, etc.»): si parte dal filmato chiaro; da PRIMA compaiono le chiazze scure (lo
       stesso rumore che ondeggia degli aloni di L'atelier, ma con chiazze di quasi due terzi di schermo): poche e piccole, poi si allargano e si
       fondono, finché a TUTTO il filmato scuro copre tutto; poi le scritte, e la voce di questa pagina e i numeri si accendono nel blu di α, β, γ, δ.
     - La forma delle chiazze la disegna la scheda grafica (WebGL, senza filmato dentro: così funziona anche aperta dal disco), i filmati li unisce
       una tela normale.
     - Prima versione (13/11): le onde del mare che si ritirano e tornano (la risacca); sostituita il 14/11 su richiesta di Franco.
     PROVE: ?seme=7 (sempre le stesse chiazze), ?tempo=7500 (ferma a 7,5 secondi; poi window.vaiA(ms) porta a un altro istante).
     DAL 15/11 LA PAGINA SCORRE: finita l'apertura (classe «scritte» + 2,5 s) il corpo prende «scorre» e sotto sale <main class="sotto"> con QUATTRO TEMPI.
     Con ?tempo= non si sblocca mai. Altre prove: ?vai=tempi (sblocca subito e porta alla sezione), ?vai=tempi&carta=N (la carta N al centro, poi «posato»),
     ?prova=1 (il pulsante «Rivedi · luce nuova»).
     DAL 16/11 (quarta sessione) LA ROTELLA NON RESTA MAI MORTA: a pagina ancora chiusa la prima spinta in giù (rotella, freccia giù, Pag giù, spazio, il
     dito) fa correre la presentazione al finale (il filmato otto volte più svelto) e poi la pagina si apre subito e scende; chi non tocca niente vede
     tutto come prima. Il perché e il codice: «IL TEMPO» nel primo script e «LA ROTELLA NON RESTA MAI MORTA» nel secondo.
     DAL 16/11 SERA: le voci e «Commissione» ci sono dall'inizio (anche sul chiaro), e la scritta grande HORA VERA affiora una lettera alla volta, in
     basso: le parole di Franco e come è fatto stanno in testa a «LE SCRITTE» nello stile. Prove: window.scrittaGrande() (ogni lettera: quanto si
     vede, quanto è discosta, quanto scuro ha dietro), window.provaMacchia(t) (la macchia calcolata per le lettere contro quella disegnata). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --blu: #8fb0ee; --blu-buio: #1f242e; --buio: #0a0908; --avorio: #ece5d8; --tenue: #9c9387; --spento: #5d564d; --oro: #d9b08c; --linea: rgb(236 229 216 / .14);
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --sans: "Manrope", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--buio); }
body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: var(--buio); color: var(--avorio); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }

/* la scena: il filmato sotto (serve solo da sorgente), la tela sopra, e un nero che si alza all'inizio */
.scena { position: fixed; inset: 0; overflow: hidden; background: var(--buio); }
.scena video { position: absolute; left: 0; top: 0; width: 100%; height: 200%; object-fit: cover; }
.scena canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scena::after { content: ""; position: absolute; inset: 0; background: var(--buio); transition: opacity 1.6s ease; }
body.parte .scena::after { opacity: 0; }
body.fermo .scena::after { transition: none; }

/* LE SCRITTE (rifatte il 16/11/2026 sera). Le parole di Franco, alla lettera, da spuntare sugli scatti:
   LE VOCI
   1. «Ora come ora nella pagina di presentazione le varie voci compaiono solo alla fine, quando la pagina è in dark mode completo. Vorrei che
      fossero attive anche in modalità non scura.»
   2. «Si tratta di cambiare loro colore o altro per fare sì che siano sempre visibili al massimo grado. Lì puoi scegliere tu, basta che
      l'effetto sia bello.»
   LA SCRITTA GRANDE («Adesso non compare nessuna scritta HORA VERA. L'ho deciso adesso di fare questa comparsa ad effetto.»)
   3. «Vorrei che scritto grande emergessero sulla pagina di presentazione le lettere di HORA VERA, una alla volta, a partire dalla prima fino
      all'ultima.»
   4. «La H compare per prima (vedi anche tu come può cambiare colore o altro insieme alle altre lettere per essere sempre ben visibile sullo
      sfondo che cambia)»
   5. «dopo la H compare la O a una piccola distanza dalla H, quella distanza viene poi ridotta perché la O si sposta da destra a sinistra più
      vicino alla lettera H»
   6. «dopo compare la lettera R (affiora o emerge, può essere un effetto in cui da massima trasparenza si passa a massima opacità).»
   7. «La lettera R compare a una distanza dalla precedente (ovvero dalla O) leggermente maggiore della distanza alla quale la lettera O era
      comparsa vicino alla H.»
   8. «Anche la lettera R poi riduce la distanza e si avvicina alla O per avere praticamente la stessa distanza fissa che la O ha dalla H.
      Questo vale per tutte le lettere.»
   COME È FATTO (scelte di Claude dove Franco ha detto «puoi scegliere tu»):
   - Ogni lettera che deve leggersi sempre è uno <span class="l">: INCHIOSTRO finché dietro di lei c'è il filmato chiaro, AVORIO quando la
     macchia scura la raggiunge (la classe «s», che il codice mette lettera per lettera calcolando la stessa macchia del disegno): le parole
     cambiano tono una lettera dopo l'altra, al passaggio dell'ombra. Intorno a ogni lettera un alone del tono opposto: sul fondo giusto non
     si vede, e la stacca dove il disegno ha il suo stesso tono (uno schizzo d'inchiostro, il quadrante chiaro).
   - Le voci e «Commissione» entrano subito, mentre il nero iniziale si alza; «Commissione» resta avorio (lì il disegno è scuro in tutti e due i
     filmati). Alla fine, come prima, si alza il velo scuro negli angoli e la voce di questa pagina e i numeri hanno il loro bagliore blu.
   - La scritta grande sta in basso al centro, sotto il viso e la mano; va DA SOLA, con il tempo del filmato: la H affiora a 1,5 secondi, poi una
     lettera ogni 1,1 secondi: affiora ferma (da trasparente a piena) un po' discosta, e poi scivola da destra a sinistra fino alla distanza
     di tutte; ogni lettera compare un po' più discosta di quella prima. L'ultima è a posto a 10,2 secondi, quando lo scuro sta per coprire tutto.
   - Il marchio piccolo sopra le voci è stato tolto: di «HORA VERA» ce n'è una sola, quella grande. */
:root { --inchiostro: #14120f; --blu-inchiostro: #2c4684; }
.velo { position: fixed; z-index: 4; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2.2s ease;
  background: radial-gradient(120% 90% at 0% 0%, rgb(10 9 8 / .62), rgb(10 9 8 / 0) 46%), radial-gradient(60% 40% at 100% 0%, rgb(10 9 8 / .5), rgb(10 9 8 / 0) 60%); }
.testa { position: fixed; z-index: 5; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 26px clamp(18px, 4.2vw, 70px); pointer-events: none; }
.testa a { pointer-events: auto; }
/* una lettera che si legge sempre: inchiostro sul chiaro, avorio sullo scuro («s»), con l'alone del tono opposto */
.l { color: var(--inchiostro); text-shadow: 0 0 .5em rgb(236 229 216 / .9), 0 0 .16em rgb(236 229 216 / .85); transition: color .45s ease, text-shadow .45s ease; }
.l.s { color: var(--avorio); text-shadow: 0 0 .5em rgb(10 9 8 / .8), 0 0 .16em rgb(10 9 8 / .7); }
.menu ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.menu li { overflow: hidden; }
body.voci-su .menu li { overflow: visible; }                              /* finita l'entrata, l'alone delle lettere non va più tagliato */
.menu li a { display: inline-flex; align-items: baseline; gap: 16px; padding: 2px 0; font: 300 clamp(1.3rem, 1.9vw, 1.7rem)/1.15 var(--serif); color: var(--avorio); text-decoration: none;
  transform: translateY(112%); transition: transform 1.25s cubic-bezier(.2, .7, .1, 1) calc(var(--i) * 170ms + 150ms), color .4s; }
.menu li a b { min-width: 2.1em; font: 600 .58rem/1 var(--sans); letter-spacing: .22em; color: var(--blu-buio); }
.menu li a.qui { font-style: italic; color: var(--blu-buio); }
/* la voce di questa pagina e i numeri: blu d'inchiostro sul chiaro, il blu di alfa e beta sullo scuro; lo stesso per la voce su cui passa il mouse */
.menu li a b .l, .menu li a.qui .l, .menu li a:hover .l { color: var(--blu-inchiostro); }
.menu li a b .l.s, .menu li a.qui .l.s, .menu li a:hover .l.s { color: var(--blu); }
.commissione { font: 600 .68rem/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--avorio); text-decoration: none; border: 1px solid rgb(236 229 216 / .3); padding: 11px 16px; opacity: 0;
  text-shadow: 0 0 .7em rgb(10 9 8 / .85); background: rgb(10 9 8 / .22); transition: opacity 1.6s ease .7s, border-color .4s; }
.commissione:hover { border-color: var(--oro); }
/* LA SCRITTA GRANDE: in basso al centro; ogni lettera affiora e poi scivola al suo posto (opacità e spostamento li scrive il codice, dal tempo del filmato) */
.grande { position: fixed; z-index: 5; left: 0; right: 0; bottom: 11.5vh; margin: 0; display: flex; justify-content: center; white-space: nowrap; pointer-events: none; user-select: none;
  font: 500 clamp(2.5rem, 9.4vw, 11.5rem)/1 var(--serif); }
/* due copie una sull'altra. «neg» è il NEGATIVO del disegno (bianca, fusa in «difference»: scura dove il disegno è chiaro, chiara dove è nero) e si
   vede finché dietro c'è il filmato chiaro; «pos» è avorio con il suo alone scuro e ne prende il posto, lettera per lettera, dove arriva lo scuro */
.grande.neg { mix-blend-mode: difference; }
.grande .l { display: inline-block; margin-left: .12em; opacity: 0; will-change: transform, opacity; transition: none; }
.grande .l:first-child { margin-left: 0; }
.grande .l.parola { margin-left: .58em; }
.grande.neg .l { color: #fff; text-shadow: none; }
.grande.pos .l { color: var(--avorio); text-shadow: 0 0 .045em rgb(10 9 8 / .9), 0 0 .2em rgb(10 9 8 / .65); }
body.voci .menu li a { transform: none; }
body.voci .commissione { opacity: 1; }
body.scritte .velo { opacity: 1; }
/* LE VOCI SI ACCENDONO (Franco, 14/11: «alla fine accendi le voci»; quelle beige diventano del colore di α, β, γ, δ). Dal 16/11 il blu lo porta
   già la macchia scura, lettera per lettera; alla fine, quando lo scuro è dappertutto, resta il bagliore: due secondi di luce blu intorno
   alla voce di questa pagina e ai numeri, che poi si spegne. */
@keyframes bagliore { 0%, 100% { text-shadow: 0 0 .5em rgb(10 9 8 / .8), 0 0 .16em rgb(10 9 8 / .7); } 60% { text-shadow: 0 0 .4em rgb(105 150 240 / .75), 0 0 .16em rgb(10 9 8 / .7); } }
/* PAGINA-FLUIDA 8 — Al ritorno il bagliore ritrova il suo tempo anche dopo display:none. */
body.scritte .menu li a.qui .l, body.scritte .menu li a b .l { animation: bagliore 2s ease-out calc(var(--i) * 170ms + 500ms - var(--bagliore-passato, 0ms)); }

/* solo per la prova: rivedere con chiazze nuove */
.rivedi { position: fixed; z-index: 6; left: clamp(18px, 4.2vw, 70px); bottom: 22px; padding: 8px 0; background: none; border: 0; cursor: pointer; font: 600 .6rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--tenue); opacity: 0; pointer-events: none; transition: opacity 1.2s ease 2.4s, color .3s; }
.rivedi:hover { color: var(--blu); }
body.scritte .rivedi { opacity: 1; pointer-events: auto; }
@media (max-width: 720px) {
  .testa { padding: 20px 18px; }
  .commissione { padding: 9px 12px; }
  .grande { font-size: 12.6vw; bottom: 13vh; }
}
@media (prefers-reduced-motion: reduce) { .menu li a, .commissione, .velo, .l { transition-duration: .01s; transition-delay: 0s; } .menu li a.qui .l, .menu li a b .l { animation: none !important; } }

/* ---- A) LA PAGINA SCORRE (15/11): finita l'apertura il corpo si sblocca; la scena resta ferma dietro e <main class="sotto"> le sale sopra ---- */
body.scorre { height: auto; overflow-y: auto; }
body:not(.prova) .rivedi { display: none; }
.scorri { position: fixed; z-index: 6; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; padding-left: .34em;
  font: 600 .6rem/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--tenue); opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }
.scorri::after { content: ""; width: 1px; height: 38px; background: linear-gradient(var(--oro), rgb(217 176 140 / 0)); opacity: .75; }
body.scorre .scorri { opacity: 1; }
body.scorre.sceso .scorri { opacity: 0; transition-duration: .6s; }
/* PAGINA-FLUIDA 1 — La soglia di copertura è alta quanto il vecchio margine, anche con le barre di Android. */
.spazio-apertura { position: relative; height: 100vh; pointer-events: none; }
.spazio-apertura > i { position: absolute; top: 0; width: 1px; height: 8px; }
.spazio-apertura > .soglia-home { height: 92vh; height: 92dvh; }
.sotto { position: relative; z-index: 7; background: var(--buio); }
body.coperta :is(.scena, .velo, .testa, .grande, .scorri, .rivedi, #lingua) { display: none; }
/* HOME (Franco, 16/11/2026: «in ogni sezione di ogni pagina deve esserci la possibilità di tornare alla HOME, puoi pure scrivere la parola HOME tanto
   ormai la conoscono in tutto il mondo»; «La HOME è la pagina di Presentazione ovviamente»). In alto a sinistra, nello stesso punto e con lo stesso
   aspetto in tutte le pagine (in Visioni e in L'atelier è la scritta della testata, che già portava qui). In questa pagina compare quando la
   presentazione è passata (la classe «giu»), e riporta in cima con una breve dissolvenza nel buio: non un lungo scorrimento all'indietro. */
.casa { position: fixed; z-index: 9; left: clamp(18px, 4.2vw, 70px); top: 26px; font: 500 .82rem/1 var(--sans); letter-spacing: .46em; color: var(--avorio); text-decoration: none;
  text-shadow: 0 0 .9em rgb(10 9 8 / .9), 0 0 .3em rgb(10 9 8 / .9); opacity: 0; pointer-events: none; transition: opacity .7s ease, color .4s; }
.casa::after { content: ""; display: block; width: 100%; height: 1px; margin-top: 16px; background: var(--oro); opacity: .7; }
.casa:hover { color: var(--blu); }
body.giu .casa { opacity: 1; pointer-events: auto; }
.casa-velo { position: fixed; z-index: 60; inset: 0; background: var(--buio); opacity: 0; pointer-events: none; transition: opacity .38s ease; }
body.torna .casa-velo { opacity: 1; }
@media (max-width: 720px) { .casa { top: 20px; } }

/* ---- C) QUATTRO TEMPI: un palco fermo, dentro una fascia che scorre verso sinistra mentre si scende (un solo movimento lento) ---- */
/* PAGINA-FLUIDA 2 — La corsa del palco occupa il suo posto anche entrando direttamente nel finale. */
.qt { position: relative; --qt-r: min(70vh, 45vw); --qt-cartello: clamp(150px, 13vw, 230px); --qt-gap: 6vw;
  --qt-sx: clamp(18px, 6vw, 110px); --qt-dx: calc((100vw - 2 * var(--qt-r)) / 2); }
@media (min-width: 860.01px) {
  .qt::after { content: ""; display: block;
    --fascia: calc(var(--qt-sx) + var(--qt-dx) + var(--cartelli) * var(--qt-cartello) + var(--carte) * 2 * var(--qt-r) + var(--intervalli) * var(--qt-gap));
    /* Il 100% del padding è la larghezza della sezione, al netto della barra di scorrimento. */
    padding-top: max(0px, calc(var(--fascia) - 100%));
    padding-top: max(0px, calc(round(nearest, var(--fascia), 1px) - 100%)); }
}
.qt-palco { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; }
.qt-fascia { position: relative; display: flex; align-items: center; gap: var(--qt-gap); width: max-content; will-change: transform;
  padding: 0 var(--qt-dx) 0 var(--qt-sx); }
.qt-cartello { flex: none; width: var(--qt-cartello); display: grid; gap: 16px; align-content: center; }
.qt-num { font: 400 1.25rem/1 var(--serif); letter-spacing: .14em; color: var(--blu); }
.qt-titolo { margin: 0; font: 300 clamp(2rem, 3vw, 2.9rem)/1.02 var(--serif); color: var(--avorio); }
.qt-musica { font: italic 400 1rem/1 var(--serif); letter-spacing: .03em; color: var(--blu); }
.qt-carta { flex: none; display: flex; margin: 0; opacity: .6; transition: opacity 1.4s ease; will-change: opacity; }   /* fuori dal centro al 60% (Franco, 20/11: al 22% erano «troppo avvolti da un alone di oscurità») */
.qt-carta.qt-destra { flex-direction: row-reverse; }                        /* nelle carte dispari il filmato sta a destra */
.qt-carta.qt-viva { opacity: 1; }
.qt-riq { flex: none; width: var(--qt-r); aspect-ratio: 4 / 3; overflow: hidden; }
.qt-film { background: #000; }
/* IL LOGO NEL RIQUADRO DELLE SCRITTE (Franco, 16/11: «dove ci sono le scritte, più grande e al massimo di opacità»): al centro in basso, sotto il testo,
   che gli lascia il posto (il padding in basso di .qt-testo); pieno, senza trasparenza; le lancette le gira lo scorrimento */
.qt-logo { position: absolute; left: 50%; bottom: calc(var(--qt-r) * .068); height: calc(var(--qt-r) * .165); aspect-ratio: 168 / 186; transform: translateX(-50%); pointer-events: none; overflow: visible; }
.qt-film video { display: block; width: 100%; height: 100%; object-fit: cover; }
.qt-testo { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 calc(var(--qt-r) * .1) calc(var(--qt-r) * .245); border: 1px solid var(--linea); }
.qt-voce { font: 600 clamp(.6rem, calc(var(--qt-r) * .017), .74rem)/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--tenue); margin-bottom: calc(var(--qt-r) * .05); }
.qt-numero { font: 300 calc(var(--qt-r) * .078)/1.05 var(--serif); color: var(--blu); margin-bottom: calc(var(--qt-r) * .028); }
.qt-nome { font: italic 400 calc(var(--qt-r) * .042)/1.2 var(--serif); color: var(--avorio); margin-bottom: calc(var(--qt-r) * .04); }
.qt-dice { margin: 0; font: 400 clamp(14px, calc(var(--qt-r) * .026), 18px)/1.62 var(--sans); color: rgb(236 229 216 / .82); }
.qt-dove { position: absolute; z-index: 2; left: clamp(18px, 4.2vw, 70px); top: 76px; margin: 0; display: flex; gap: 16px; align-items: baseline;   /* sotto HOME, che sta in alto a sinistra in ogni sezione */
  font: 600 .62rem/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; color: var(--tenue); }
.qt-ora { font: italic 400 1.05rem/1 var(--serif); letter-spacing: .02em; text-transform: none; color: var(--avorio); }
.qt-filo { position: absolute; left: clamp(18px, 4.2vw, 70px); right: clamp(18px, 4.2vw, 70px); bottom: 34px; height: 1px; background: var(--linea); }
.qt-filo i { position: absolute; inset: 0; background: var(--oro); opacity: .8; transform: scaleX(0); transform-origin: 0 50%; will-change: transform; }
/* sul telefono, per oggi: una colonna (filmato, sotto il racconto), senza palco fermo */
@media (max-width: 860px) {
  .qt { --qt-r: calc(100vw - 32px); height: auto !important; padding: 64px 16px 72px; }
  .qt-palco { position: static; height: auto; overflow: visible; display: block; }
  .qt-dove { position: static; margin-bottom: 32px; }
  .qt-filo { display: none; }
  .qt-fascia { flex-direction: column; align-items: stretch; width: auto; padding: 0; gap: 40px; transform: none !important; }
  .qt-cartello { width: auto; margin-top: 24px; }
  .qt-carta, .qt-carta.qt-destra { flex-direction: column; opacity: 1; }
  .qt-riq { width: 100%; }
  .qt-testo { aspect-ratio: auto; padding: 24px 22px 28px; border-top: 0; }
  .qt-logo { position: static; transform: none; height: 88px; margin: 26px auto 0; }
  .qt-nome { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) { .qt-carta { transition: none; } }

/* ---- IL TELEFONO (18/11/2026). Le parole di Franco dal suo telefono, alla lettera, spuntate sugli scatti a 360 × 662 e a 390 × 844:
   [x] 1. «la pagina L'ora vera appare prima nera poi bianca»   → il nero dell'inizio si alza più piano e senza scatto; se il filmato non parte si resta sullo scuro
   [x] 2. «VENEZIA AUTUNNO è tagliato»                           → in otto.css (il filmato un po' più grande, la scritta più stretta)
   E quel che ha trovato la diagnosi alla misura del suo telefono:

void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

precision highp float;
precision highp int;
uniform vec2 uRes;          // misura della tela delle chiazze
uniform float uT;           // secondi
uniform vec2 uSeme;         // il caso di questa volta
uniform float uSoglia;      // dove il rumore supera la soglia, si vede il chiaro
uniform int uModo;          // 0 = disegna; 1 = scrive il rumore (per misurare quale soglia scopre quanta parte dello schermo)

uint mescola(uvec2 p) { p *= uvec2(1597334673u, 3812015801u); uint n = (p.x ^ p.y) * 1597334673u; n ^= n >> 16u; n *= 2246822519u; n ^= n >> 13u; return n; }
vec2 verso(vec2 i) { uint n = mescola(uvec2(ivec2(i) + 8192)); return vec2(float(n & 65535u), float(n >> 16u)) / 32767.5 - 1.0; }

    voci.forEach(v => {
      const a = el('article', 'qt-carta' + (carte.length % 2 ? ' qt-destra' : '')), f = el('div', 'qt-riq qt-film'), video = document.createElement('video');

      video.setAttribute('muted', ''); video.setAttribute('playsinline', ''); video.setAttribute('aria-hidden', 'true');

      f.append(video);
      const r = el('div', 'qt-riq qt-testo'), lg = logo();
      r.append(el('span', 'qt-voce', v.voce), el('strong', 'qt-numero', v.numero), el('em', 'qt-nome', v.nome), el('p', 'qt-dice', v.dice), lg);
      a.append(f, r); FASCIA.append(a);
      carte.push({ e: a, v: video, tempo: t.titolo, k: t.k, x: 0, mani: Array.from(lg.querySelectorAll('[data-l]'), g => ({ g, l: g.getAttribute('data-l') })) });

  const figli = FASCIA.childElementCount;

  SEZ.style.setProperty('--cartelli', figli - carte.length);

  if (vuota) SEZ.hidden = true; else ORA.textContent = carte[0].tempo;

  // le misure: quanto la fascia è più larga dello schermo (= quanto in più è alta la sezione) e dove stanno i centri delle carte
  let max = 0, cima = 0, mostra = 0, viva = -1, seguita = 0, attesa = 0, tratti = [], ultima = '';
  const largo = () => !TEL.matches;
  let visibile = false, sporca = true, larghezza = 0, altezza = 0, fondo = 0;
  let cartaDiProva = null, ingresso = true;
  // LE LANCETTE DEL LOGO: un tratto per tempo (da metà strada tra due tempi a metà strada tra i due dopo); «pos» sono i centri delle carte
  // (di lato sul computer, in altezza sul telefono), «inizio» e «fine» i due capi della sezione nella stessa misura

    const t = [];
    carte.forEach((c, i) => { const u = t[t.length - 1]; if (u && u.k === c.k) u.ult = i; else t.push({ k: c.k, pri: i, ult: i }); });
    t.forEach((u, j) => { u.da = j ? (pos[t[j - 1].ult] + pos[u.pri]) / 2 : inizio; u.a = j < t.length - 1 ? (pos[u.ult] + pos[t[j + 1].pri]) / 2 : fine; });

  }
  // dove si è (centro) → gli angoli: in ogni tratto gira una lancetta sola, le altre restano dove sono; con «riduci movimento» restano nella posa
  // IL BATTITO (20/11/2026, Franco: «vorrei che le si vedesse girare in continuità e non solo quando si va giù… sembra che siano ferme»):
  // sopra i giri dello scorrimento le lancette vanno da sole, piano: secondi un giro al minuto, minuti ogni 15 minuti, ore ogni 3 ore
  const BATTITO = { s: 6, m: 0.4, h: 1 / 30 };   // gradi al secondo
  function angoli(centro) {
    const a = { h: POSA.h, m: POSA.m, s: POSA.s };
    if (!CALMO) { const t = performance.now() / 1000; a.h += BATTITO.h * t; a.m += BATTITO.m * t; a.s += BATTITO.s * t; }

<script>
  // LE SCRITTE NON SONO MAI BEIGE (Franco, 15/11 notte: «togli le scritte beige e falle dello stesso colore di alfa, beta, etc.»): in questa pagina le

  window.scritteBeige = () => { const prova = document.createElement('i'); prova.style.color = 'var(--oro)'; document.body.appendChild(prova);
    const beige = geometriaHV.stile(prova).color; prova.remove();
    return [...document.querySelectorAll('body *')].filter(e => geometriaHV.stile(e).color === beige)
      .map(e => ((typeof e.className === 'string' && e.className) || e.tagName.toLowerCase()) + (e.textContent.trim() ? ' «' + e.textContent.trim().slice(0, 24) + '»' : '')); };
  // PAGINA-FLUIDA 3 — foto-pagina.js apre questa copia locale e raccoglie Runtime.exceptionThrown.
  if (/\/\.prova-viewport-\d+\.html$/.test(location.pathname)) {
    addEventListener('load', () => setTimeout(() => {
      const b = window.scritteBeige();
      if (b.length) throw new Error('Scritte beige nella prima pagina (vanno nel blu di alfa e beta): ' + b.slice(0, 5).join(' | '));
    }, 1500));
  }
</script>
