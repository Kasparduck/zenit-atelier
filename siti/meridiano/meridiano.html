<!doctype html><html lang="it"><head><meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridiano — Boutique dimostrativa</title><meta name="description" content="Portfolio di Franco Fusi: Meridiano, Studio Soglia e Velinea."><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./vetrina.css"><script defer src="./vetrina.js"></script></head><body><div id="root"></div><noscript>Attiva JavaScript per esplorare questa vetrina.</noscript><script>/* dentro la vetrina Zenit Atelier (11/11): il telescopio fa scorrere la pagina e il tasto Esc riporta al telescopio; da solo non fa niente */ if (parent !== window) { addEventListener("message", e => { const d = e.data; if (d && typeof d.scorri === "number") scrollBy({ top: d.scorri, behavior: "instant" }); }); addEventListener("keydown", e => { if (e.key === "Escape") parent.postMessage({ esci: 1 }, "*"); }); }</script><!-- zenit-rovescio: uscendo dalla lente della vetrina Zenit Atelier il sito si rovescia e poi torna com'è (pezzo unico: progetti/vetrina/telescopio/pezzo-rovescio.html, si monta con strumenti/monta-rovescio.js) -->
<style>html.zenit-rovescio { filter: invert(1) hue-rotate(180deg); } html.zenit-rovescio :is(img, video, canvas, .zenit-tieni) { filter: brightness(var(--zenit-foto, 1)) invert(1) hue-rotate(180deg); }   /* prima si abbassa la luce della foto, poi la si rovescia: al contrario esce slavata */
html.zenit-passa::view-transition-old(root), html.zenit-passa::view-transition-new(root) { animation-duration: var(--zenit-ms, 2600ms); animation-timing-function: cubic-bezier(.45, 0, .55, 1); }</style>
<script>if (parent !== window) addEventListener("message", e => { const d = e.data, h = document.documentElement; if (!d || !("rovescio" in d)) return;
  if (d.rovescio) { h.style.setProperty("--zenit-foto", d.foto || 1); h.classList.add("zenit-rovescio"); setTimeout(() => parent.postMessage({ rovescio: "fatto" }, "*"), 0); return; }   /* niente requestAnimationFrame: in una pagina nascosta non scatta */
  if (!h.classList.contains("zenit-rovescio")) return; const via = () => h.classList.remove("zenit-rovescio");
  if (!document.startViewTransition || !d.ms || matchMedia("(prefers-reduced-motion: reduce)").matches) return via();
  h.style.setProperty("--zenit-ms", d.ms + "ms"); h.classList.add("zenit-passa");
  document.startViewTransition(via).finished.finally(() => h.classList.remove("zenit-passa")); });</script>
<!-- /zenit-rovescio -->
</body></html>
